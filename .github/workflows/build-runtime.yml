name: 🛠️ 构建 & 推送 MSLX 运行时镜像

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'

env:
  IMAGE_NAME: xiaoyululu/mslx-runtime
  TENCENT_REGISTRY: hkccr.ccs.tencentyun.com

jobs:
  build-and-push:
    name: 构建运行时 -> ${{ matrix.java_version == 'network-tool' && 'Network Tool' || format('Java {0}', matrix.java_version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java_version: ["8", "11", "17", "21", "25", "network-tool"]
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨平台模拟器
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v3

      # --- 登录 Docker Hub ---
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- 登录腾讯云 (香港) ---
      - name: 登录腾讯云 TCR (香港)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_DOCKER_USERNAME }}
          password: ${{ secrets.TENCENT_DOCKER_PASSWORD }}

      # --- 格式化 Tag 标签 ---
      - name: 获取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.TENCENT_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=network-tool,enable=${{ matrix.java_version == 'network-tool' }}
            type=raw,value=java${{ matrix.java_version }},enable=${{ matrix.java_version != 'network-tool' }}

      # --- 多平台联合构建与推送 ---
      - name: 🚀 执行跨平台构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.java_version == 'network-tool' && './Dockerfile.network' || './Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.java_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=true

  trigger-sync:
    name: 唤醒 CNB 同步中转站
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: 发送同步信号至 CNB
        env:
          CNB_REPO_SLUG: "mslmc/mslx-runtime-sync"
          CNB_TOKEN: ${{ secrets.CNB_DOCKER_REPO_TOKEN }}
        run: |
          echo "所有版本的香港 TCR 镜像构建完毕，正在下达跨地域全量同步指令..."
          
          curl -s -X POST \
            -H "Authorization: token $CNB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{
              \"branch\": \"main\",
              \"event\": \"api_trigger_runtime_sync\"
            }" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/build/start"
          
          echo "🎉 已经成功唤醒 CNB 独立运行时同步中转站！"
